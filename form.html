<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><Form></Form></title>
  </head>
  <body>
    <header>
      <form>
        <div class="search">
          <label for="search">Search your image here:</label>
          <input type="text" name="" id="search" />
          <input type="submit" value="Search" />
        </div> <br>
        <div class="img">
          <img width="300px" src="/motorbike.jpg" />
        </div>
        <p>For more <a href="#">Click here!</a></p>
        <hr>
        <p>Feedback Form:</p>
        <label for="name">Name</label>
        <input type="text" name="" id="name"> <br> <br>
        <label for="date">Date</label>
        <input type="date" name="" id="date"> <br> <br>
        <label for="comment">Comment:</label> <br>
        <textarea id="comment" name="" cols="30" rows="5"></textarea> <br>
        <input type="submit" value="Submit">
      </form>
    </header>
  </body>
</html>
