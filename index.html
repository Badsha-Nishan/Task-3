<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <style>
      td, th {
        border: 1px solid black;
        padding: 10px;
      }
      table{
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <header>
      <form>
        <div class="search">
          <label for="search">Search your image here:</label>
          <input type="text" name="" id="search" />
          <input type="submit" value="Search" />
        </div>
        <br />
        <div class="img">
          <img width="300px" src="/motorbike.jpg" />
        </div>
        <p>For more <a href="#">Click here!</a></p>
        <hr />
        <p>Feedback Form:</p>
        <label for="name">Name</label>
        <input type="text" name="" id="name" /> <br />
        <br />
        <label for="date">Date</label>
        <input type="date" name="" id="date" /> <br />
        <br />
        <label for="comment">Comment:</label> <br />
        <textarea id="comment" name="" cols="30" rows="5"></textarea> <br />
        <select name="Good" id="Good">
          <option value="Select" selected>Select</option>
          <option value="">Good</option>
          <option value="">Very Good</option>
          <option value="">Excellent</option>
          <option value="">Not Good</option>
        </select>
        <br />
        <br />
        <input type="submit" value="Submit" />
      </form>
    </header>
    <main>
      <h2>Table Tennis Tournament</h2>
      <table>
        <caption>
          Tournament Schedule and Result
        </caption>
        <thead>
          <tr>
            <th>Round 1</th>
            <th>Player A</th>
            <th>Player B</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Match 1</td>
            <td>John</td>
            <td>Alice</td>
          </tr>
          <tr>
            <td>Match 2</td>
            <td>Mark</td>
            <td>Sarah</td>
          </tr>
          <th>Round 2</th>
          <th>Player C</th>
          <th>Player D</th>
          <tr>
            <td>Match 3</td>
            <td>TBD</td>
            <td>TBD</td>
          </tr>
          <tr>
            <td>Match 4</td>
            <td>TBD</td>
            <td>TBD</td>
          </tr>
          <th>Final</th>
          <th>Winner of Match 3</th>
          <th>Winner of Match 4</th>
          <tr>
            <td>Champion</td>
            <td>TBD</td>
            <td>TBD</td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
